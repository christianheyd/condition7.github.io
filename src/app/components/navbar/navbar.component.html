  @if (!useOverlayMenu) {
    <ul class="links">
      @for (item of navItems; track item.name) {
        <li class="link">
          <a [routerLink]="item.url" routerLinkActive="active">{{ item.name }}</a>
        </li>
      }
    </ul>
  } @else {
    @if (!showOverlayMenu) {
      <app-icon-button
        class="overlay-menu-button"
        icon="menu"
        label="Menu"

      >
      </app-icon-button>
    }
  }

@if (useOverlayMenu) {
  <div class="overlay-menu" [class.visible]="showOverlayMenu">
    <ul class="links">
      <li class="link">
          <a [routerLink]="'/'" routerLinkActive="active" (click)="closeOverlayMenu()">Home</a>
        </li>
      @for (item of navItems; track item.name) {
        <li class="link">
          <a [routerLink]="item.url" routerLinkActive="active" (click)="closeOverlayMenu()">{{ item.name }}</a>
        </li>
      }
    </ul>
    <app-icon-button
      class="close-overlay-button"
      icon="close"
      label="Close"
      [size]="'8rem'"
      (wasClicked)="closeOverlayMenu()"
    >
    </app-icon-button>
  </div>
}
